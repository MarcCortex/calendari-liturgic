# Celebracions pròpies de Catalunya i de la diòcesi de Sant Feliu de Llobregat
# que s'afegeixen (o canvien de grau) respecte del calendari d'Espanya.
#
# Camps:
#   data:  mes-dia (MM-DD)
#   nom:    com ha d'aparèixer al calendari (en català)
#   nom_es: el mateix nom en castellà
#   grau:  solemnitat | festa | memoria | memoria-lliure | tempores
#   color: blanc | vermell | morat | verd   (no cal per a "tempores")
#
# Si coincideix amb un dia de més rang, el generador aplica les normes litúrgiques:
# les solemnitats es traslladen, les festes i memòries s'ometen
# i, a Quaresma i del 17 al 31 de desembre, les memòries passen a commemoració.

