  titol: "📘 Aprovació del Directori catequètic del Camí ({n} aniversari)"
  titol_es: "📘 Aprobación del Directorio catequético del Camino ({n} aniversario)"
  descripcio: El 26 de desembre de 2010 la Santa Seu va aprovar oficialment el Directori catequètic del Camí Neocatecumenal.
