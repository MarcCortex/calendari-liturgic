# Dates del Camí Neocatecumenal.
#
# Camps:
#   data:           data original (AAAA-MM-DD)
#   titol:          títol en català. Si s'escriu {n}, es substitueix per l'ordinal
#                   de l'aniversari (1r, 2n, 25è...).
#   titol_es:       títol en castellà (si no hi és, es fa servir el català)
#   descripcio:     text en català que surt en obrir l'esdeveniment (opcional)
#   descripcio_es:  el mateix text en castellà (opcional)
#   font:           enllaç a la font (opcional)
#   repeteix:       true (per defecte) = surt cada any per l'aniversari;
#                   false = surt només el dia indicat (per a una convivència, una trobada...)
#
# Per afegir-hi una data, copia un bloc, canvia'l i desa el fitxer.
# Els calendaris es tornen a publicar sols al cap d'un parell de minuts.

- data: 2016-07-19
  titol: "✝️ {n} aniversari de la mort de Carmen Hernández"
  titol_es: "✝️ {n} aniversario de la muerte de Carmen Hernández"
  descripcio: >-
    Carmen Hernández Barrera, coiniciadora del Camí Neocatecumenal, va morir a Madrid
    el 19 de juliol de 2016, als 85 anys. Està enterrada al Seminari Redemptoris Mater de Madrid.
    El 19 de juliol de 2021 es va demanar formalment l'obertura de la seva causa de beatificació.
  descripcio_es: >-
    Carmen Hernández Barrera, coiniciadora del Camino Neocatecumenal, murió en Madrid
    el 19 de julio de 2016, a los 85 años. Está enterrada en el Seminario Redemptoris Mater de Madrid.
    El 19 de julio de 2021 se pidió formalmente la apertura de su causa de beatificación.
  font: https://www.ewtnnews.com/world/europe/neocatechumenal-way-to-conclude-diocesan-phase-of-co-founder-s-cause-for-canonization

