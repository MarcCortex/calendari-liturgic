- data: 1960-05-27
  titol: "🎂 Naixement de María Ascensión Romero ({n} aniversari)"
  titol_es: "🎂 Nacimiento de María Ascensión Romero ({n} aniversario)"
  descripcio: >-
    María Ascensión Romero, membre de l'Equip internacional del Camí Neocatecumenal amb Kiko Argüello
    i el P. Mario Pezzi, va néixer a Tudela (Navarra) el 27 de maig de 1960. Va ser itinerant 25 anys
    a l'antiga URSS (Bielorússia, Kazakhstan i Rússia).
  descripcio_es: >-
    María Ascensión Romero, miembro del Equipo internacional del Camino Neocatecumenal con Kiko Argüello
    y el P. Mario Pezzi, nació en Tudela (Navarra) el 27 de mayo de 1960. Fue itinerante 25 años
    en la antigua URSS (Bielorrusia, Kazajistán y Rusia).
  font: https://neocatechumenaleiter.org/historia/maria-ascension-romero/

- data: 2018-02-02
  titol: "👥 María Ascensión Romero, membre de l'Equip internacional ({n} aniversari)"
  titol_es: "👥 María Ascensión Romero, miembro del Equipo internacional ({n} aniversario)"
  descripcio: >-
    El 2 de febrer de 2018 María Ascensión Romero va ser nomenada oficialment membre de l'Equip internacional
    del Camí Neocatecumenal, a petició del Dicasteri per als Laics, la Família i la Vida.
  descripcio_es: >-
    El 2 de febrero de 2018 María Ascensión Romero fue nombrada oficialmente miembro del Equipo internacional
    del Camino Neocatecumenal, a petición del Dicasterio para los Laicos, la Familia y la Vida.
  font: https://neocatechumenaleiter.org/historia/maria-ascension-romero/

