  descripcio: El 12 de gener de 1977, en una audiència, sant Pau VI va dedicar el seu discurs sencer al Camí Neocatecumenal.
  descripcio_es: El 12 de enero de 1977, en una audiencia, san Pablo VI dedicó su discurso entero al Camino Neocatecumenal.
