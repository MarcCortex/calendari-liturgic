  titol: "🎂 Naixement de Carmen Hernández ({n} aniversari)"
  titol_es: "🎂 Nacimiento de Carmen Hernández ({n} aniversario)"
  descripcio: Carmen Hernández Barrera va néixer a Ólvega (Sòria) el 24 de novembre de 1930.
  descripcio_es: Carmen Hernández Barrera nació en Ólvega (Soria) el 24 de noviembre de 1930.
  font: https://neocatechumenaleiter.org/historia/carmen-hernandez/

- data: 2022-12-04
  titol: "📜 Obertura de la causa de beatificació de Carmen Hernández ({n} aniversari)"
  titol_es: "📜 Apertura de la causa de beatificación de Carmen Hernández ({n} aniversario)"
  descripcio: >-
    El 4 de desembre de 2022 es va obrir a Madrid la fase diocesana de la causa
    de beatificació i canonització de Carmen Hernández.
  descripcio_es: >-
    El 4 de diciembre de 2022 se abrió en Madrid la fase diocesana de la causa
    de beatificación y canonización de Carmen Hernández.
  font: https://www.ewtnnews.com/world/europe/neocatechumenal-way-to-conclude-diocesan-phase-of-co-founder-s-cause-for-canonization

- data: 2026-06-02
  titol: "📜 Clausura de la fase diocesana de la causa de Carmen Hernández ({n} aniversari)"
  titol_es: "📜 Clausura de la fase diocesana de la causa de Carmen Hernández ({n} aniversario)"
  descripcio: >-
    El 2 de juny de 2026 es va cloure al Seminari Redemptoris Mater de Madrid la fase diocesana
    de la causa de beatificació i canonització de Carmen Hernández. La causa continua ara a Roma.
  descripcio_es: >-
    El 2 de junio de 2026 se clausuró en el Seminario Redemptoris Mater de Madrid la fase diocesana
    de la causa de beatificación y canonización de Carmen Hernández. La causa continúa ahora en Roma.
  font: https://www.laityfamilylife.va/content/dam/laityfamilylife/Pdf/Cammino%20Neocatecumenale_ChiusuracausaHernandez_ES.pdf

- data: 1939-01-09
  titol: "🎂 Naixement de Kiko Argüello ({n} aniversari)"
  titol_es: "🎂 Nacimiento de Kiko Argüello ({n} aniversario)"
  descripcio: >-
    Francisco (Kiko) Argüello, iniciador del Camí Neocatecumenal, va néixer a Lleó
    el 9 de gener de 1939.
  descripcio_es: >-
    Francisco (Kiko) Argüello, iniciador del Camino Neocatecumenal, nació en León
    el 9 de enero de 1939.
  font: https://neocatechumenaleiter.org/historia/kiko-arguello/

- data: 2002-06-29
  titol: "📘 Aprovació ad experimentum dels Estatuts del Camí ({n} aniversari)"
  titol_es: "📘 Aprobación ad experimentum de los Estatutos del Camino ({n} aniversario)"
  descripcio: >-
    El Pontifici Consell per als Laics va aprovar els Estatuts del Camí Neocatecumenal
    ad experimentum per cinc anys amb un decret datat el 29 de juny de 2002,
    solemnitat de Sant Pere i Sant Pau.
  descripcio_es: >-
    El Pontificio Consejo para los Laicos aprobó los Estatutos del Camino Neocatecumenal
    ad experimentum por cinco años con un decreto fechado el 29 de junio de 2002,
    solemnidad de San Pedro y San Pablo.
  font: https://www.ewtn.com/catholicism/library/decree-of-approval-of-statutes-of-neocatechumenal-way-ad-experimentum-2433

- data: 2008-05-11
  titol: "📘 Aprovació definitiva dels Estatuts del Camí ({n} aniversari)"
  titol_es: "📘 Aprobación definitiva de los Estatutos del Camino ({n} aniversario)"
  descripcio: >-
    El Pontifici Consell per als Laics va concedir l'aprovació definitiva dels Estatuts
    amb decret de l'11 de maig de 2008, diumenge de Pentecosta.
    El decret es va lliurar als iniciadors el 13 de juny de 2008.
  descripcio_es: >-
    El Pontificio Consejo para los Laicos concedió la aprobación definitiva de los Estatutos
    con decreto del 11 de mayo de 2008, domingo de Pentecostés.
    El decreto se entregó a los iniciadores el 13 de junio de 2008.
  font: https://www.laityfamilylife.va/content/laityfamilylife/en/associazioni-e-movimenti/repertorio/cammino-neocatecumenale.html

- data: 1990-08-30
  titol: "✉️ Carta «Ogni qualvolta» de sant Joan Pau II ({n} aniversari)"
  titol_es: "✉️ Carta «Ogni qualvolta» de san Juan Pablo II ({n} aniversario)"
  descripcio: >-
    Amb la carta «Ogni qualvolta» del 30 d'agost de 1990, Joan Pau II va reconèixer
    el Camí Neocatecumenal com un itinerari de formació catòlica vàlid
    per a la societat i els temps d'avui.
  descripcio_es: >-
    Con la carta «Ogni qualvolta» del 30 de agosto de 1990, Juan Pablo II reconoció
    el Camino Neocatecumenal como un itinerario de formación católica válido
    para la sociedad y los tiempos actuales.
  font: https://neocatechumenaleiter.org/historia/kiko-arguello/

- data: 2012-01-08
  titol: "🕊️ Aprovació de les celebracions del Camí ({n} aniversari)"
  titol_es: "🕊️ Aprobación de las celebraciones del Camino ({n} aniversario)"
  descripcio: >-
    El 8 de gener de 2012 la Santa Seu va aprovar les celebracions contingudes en el Directori
    catequètic del Camí Neocatecumenal. El 20 de gener de 2012 Benet XVI va rebre el Camí
    en audiència a l'Aula Pau VI.
  descripcio_es: >-
    El 8 de enero de 2012 la Santa Sede aprobó las celebraciones contenidas en el Directorio
    catequético del Camino Neocatecumenal. El 20 de enero de 2012 Benedicto XVI recibió al Camino
    en audiencia en el Aula Pablo VI.
  font: https://neocatechumenaleiter.org/historia/kiko-arguello/

- data: 1942-09-19
  titol: "🎂 Naixement del P. Mario Pezzi ({n} aniversari)"
  titol_es: "🎂 Nacimiento del P. Mario Pezzi ({n} aniversario)"
  descripcio: >-
    El P. Mario Pezzi, prevere de l'Equip responsable internacional del Camí Neocatecumenal
    juntament amb Kiko Argüello (i amb Carmen Hernández fins al 2016), va néixer
    a Gottolengo (Brescia, Itàlia) el 19 de setembre de 1942.
  descripcio_es: >-
    El P. Mario Pezzi, presbítero del Equipo responsable internacional del Camino Neocatecumenal
    junto con Kiko Argüello (y con Carmen Hernández hasta 2016), nació
    en Gottolengo (Brescia, Italia) el 19 de septiembre de 1942.
  font: https://neocatechumenaleiter.org/historia/mario-pezzi/

- data: 1969-03-19
  titol: "⛪ Ordenació sacerdotal del P. Mario Pezzi ({n} aniversari)"
  titol_es: "⛪ Ordenación sacerdotal del P. Mario Pezzi ({n} aniversario)"
  descripcio: >-
    El P. Mario Pezzi va ser ordenat prevere el 19 de març de 1969, com a missioner comboni.
    El gener del 1970 va entrar a la primera comunitat de la parròquia de San Giovanni di Dio (Roma),
    el juny del 1971 Kiko i Carmen el van convidar a formar part de l'equip i el 2008 la Santa Seu
    el va nomenar prevere de l'Equip internacional.
  descripcio_es: >-
    El P. Mario Pezzi fue ordenado presbítero el 19 de marzo de 1969, como misionero comboniano.
    En enero de 1970 entró en la primera comunidad de la parroquia de San Giovanni di Dio (Roma),
    en junio de 1971 Kiko y Carmen lo invitaron a formar parte del equipo y en 2008 la Santa Sede
    lo nombró presbítero del Equipo internacional.
  font: https://neocatechumenaleiter.org/historia/mario-pezzi/

- data: 1965-08-28
  titol: "🏚️ Palomeras: l'arquebisbe de Madrid atura l'enderroc de les barraques ({n} aniversari)"
  titol_es: "🏚️ Palomeras: el arzobispo de Madrid detiene el derribo de las chabolas ({n} aniversario)"
  descripcio: >-
    El 28 d'agost de 1965 una ordre governativa va disposar que la Guàrdia Civil enderroqués les barraques
    de Palomeras Altas (Madrid), on vivien Kiko i Carmen entre els pobres. L'arquebisbe de Madrid
    va aturar l'enderroc.
  descripcio_es: >-
    El 28 de agosto de 1965 una orden gubernativa dispuso que la Guardia Civil derribara las chabolas
    de Palomeras Altas (Madrid), donde vivían Kiko y Carmen entre los pobres. El arzobispo de Madrid
    detuvo el derribo.
  font: https://neocatechumenaleiter.org/historia/kiko-arguello/

